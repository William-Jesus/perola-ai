version: "3.8"

services:
  perola:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perola-ai
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Persiste a memória da Pérola (data/memoria.json) entre restarts
      - ./data:/app/data
    networks:
      - perola-net

  # Optional: Redis for future rate limiting scaling
  # redis:
  #   image: redis:7-alpine
  #   container_name: perola-redis
  #   restart: unless-stopped
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - perola-net

networks:
  perola-net:
    driver: bridge
